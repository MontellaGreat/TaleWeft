name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - "shared/**"
      - "release-manifest.json"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Check release and shared configuration
        run: npm run check:release && npm run check:shared-config

      - name: Test editor and stream behavior
        run: npm run test:unit

      - name: Install browser for smoke tests
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
        run: npx playwright install --with-deps chromium

      - name: Browser regression with real Vue components and HTTP fixtures
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/playwright
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: frontend/test-results
