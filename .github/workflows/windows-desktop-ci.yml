name: Windows Desktop Smoke

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '**.py'
      - '**.sql'
      - 'config/**'
      - 'shared/**'
      - 'infrastructure/ai/prompt_packages/**'
      - 'requirements*'
      - 'release-manifest.json'
      - '.github/workflows/windows-desktop-ci.yml'
  workflow_dispatch:

jobs:
  desktop:
    runs-on: windows-latest
    env:
      PLOTPILOT_PROD_DATA_DIR: ${{ github.workspace }}/out/ci-runtime-data
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - run: python -m pip install --require-hashes -r requirements.lock
      - run: python -m pip install --require-hashes -r requirements-build.lock
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: python scripts/build_backend_pyinstaller.py
      - run: python scripts/verify_backend_smoke.py
      - run: cargo test --locked
        working-directory: frontend/src-tauri
      - name: Official updater rejection tests (test public key only)
        shell: pwsh
        run: |
          python scripts/generate_updater_config.py --endpoint https://github.com/tauri-apps/plugins-workspace --public-key tests/fixtures/updater/updater-test.pub --output out/tauri/updater.test.json
          $env:TAURI_CONFIG = Get-Content out/tauri/updater.test.json -Raw
          cargo test --locked --manifest-path frontend/src-tauri/Cargo.toml --features signed-updater --lib updater::tests
          Remove-Item Env:TAURI_CONFIG
      - run: npm run tauri:build -- --bundles nsis
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-smoke
          path: |
            out/smoke/**
            frontend/src-tauri/target/release/bundle/nsis/*.exe
